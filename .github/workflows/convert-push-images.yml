name: Convert and push images
on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io

jobs:
  convert-push-images:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install tools
        run: |
          sudo bash tools/install-tools.sh
          sudo systemctl restart containerd
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert and push images
        run: |
          sudo -E bash tools/start-containerd.sh
          sudo -E python -u ./convert_images.py --push

  merge-manifests:
    needs: convert-push-images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install tools
        run: sudo bash tools/install-tools.sh
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge manifests
        run: python -u ./convert_images.py --merge
